name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-ipa:
    name: Build unsigned IPA
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build web assets (www/)
        run: node tools/build-www.js

      - name: Archive
        run: |
          xcodebuild \
            -project ios-native/BeHocChu.xcodeproj \
            -scheme BeHocChu \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/BeHocChu.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package IPA (unsigned)
        run: |
          mkdir -p dist/Payload
          cp -R build/BeHocChu.xcarchive/Products/Applications/BeHocChu.app dist/Payload/
          cd dist
          zip -qry ../BeHocChu.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BeHocChu-unsigned-ipa
          path: BeHocChu.ipa
          if-no-files-found: error
