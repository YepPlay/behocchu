<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1976d2">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Bé Học Chữ">
  <meta name="application-name" content="Bé Học Chữ">

  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self'; worker-src 'self'; manifest-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Học Chữ Cái Tiếng Việt</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/icon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/images/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/icon-180.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="decor" class="decor"></div>

  <section id="screen-choose" class="screen active">
    <div class="screen-body">
      <div class="fit">
        <h1 class="title">🎓 Học Chữ Cái Tiếng Việt 🇻🇳</h1>
        <div class="choose-row">
          <button class="choose-card boy" data-theme="boy">
            <span class="avatar">🧒</span>
            <span class="choose-name">Bé Trai</span>
          </button>
          <button class="choose-card girl" data-theme="girl">
            <span class="avatar">👧</span>
            <span class="choose-name">Bé Gái</span>
          </button>
        </div>
      </div>
    </div>
  </section>

  <section id="screen-menu" class="screen">
    <header class="screen-head menu-head">
      <button id="btn-switch" class="icon-btn" title="Đổi bạn học">🔄</button>
      <div id="menu-avatar" class="menu-avatar">🧒</div>
      <button class="donate-btn" title="Ủng hộ tác giả"><span class="donate-ico">💰</span><span class="donate-txt">Ủng&nbsp;Hộ</span></button>
    </header>
    <div class="screen-body">
      <div class="fit">
        <div class="mode-grid">
          <button class="mode-card featured" data-mode="learn">
            <span class="mode-icon">📖</span>
            <span class="mode-name">Học Chữ Cái</span>
            <span class="mode-best" id="best-learn"></span>
          </button>
          <button class="mode-card" data-mode="pic">
            <span class="mode-icon">🖼️</span>
            <span class="mode-name">Chọn Hình Theo Chữ</span>
            <span class="mode-best" id="best-pic"></span>
          </button>
          <button class="mode-card" data-mode="listen">
            <span class="mode-icon">🔊</span>
            <span class="mode-name">Nghe &amp; Chọn Chữ</span>
            <span class="mode-best" id="best-listen"></span>
          </button>
          <button class="mode-card" data-mode="match">
            <span class="mode-icon">🔗</span>
            <span class="mode-name">Nối Từ</span>
            <span class="mode-best" id="best-match"></span>
          </button>
          <button class="mode-card" data-mode="write">
            <span class="mode-icon">✍️</span>
            <span class="mode-name">Luyện Viết Chữ</span>
            <span class="mode-best" id="best-write"></span>
          </button>
          <button class="mode-card" data-mode="beauty">
            <span class="mode-icon">🖋️</span>
            <span class="mode-name">Luyện Viết Chữ Đẹp</span>
            <span class="mode-best" id="best-beauty"></span>
          </button>
          <button class="mode-card" data-mode="spell">
            <span class="mode-icon">🧩</span>
            <span class="mode-name">Chính Tả – Xếp Chữ</span>
            <span class="mode-best" id="best-spell"></span>
          </button>
          <button class="mode-card" data-mode="blend">
            <span class="mode-icon">🔤</span>
            <span class="mode-name">Ghép Âm</span>
            <span class="mode-best" id="best-blend"></span>
          </button>
          <button class="mode-card" data-mode="compound">
            <span class="mode-icon">🧱</span>
            <span class="mode-name">Từ Ghép</span>
            <span class="mode-best" id="best-compound"></span>
          </button>
        </div>
      </div>
    </div>
  </section>

  <section id="screen-play" class="screen">
    <header class="screen-head play-head">
      <button id="btn-back" class="icon-btn" title="Về menu">⬅️</button>
      <div class="play-progress" id="play-progress"></div>
      <button class="donate-btn" title="Ủng hộ tác giả"><span class="donate-ico">💰</span><span class="donate-txt">Ủng&nbsp;Hộ</span></button>
    </header>
    <div class="screen-body">
      <div class="fit">
        <div id="play-area"></div>
      </div>
    </div>
  </section>

  <section id="screen-summary" class="screen">
    <div class="screen-body">
      <div class="fit">
        <div class="summary-card">
          <div id="summary-emoji" class="summary-emoji">🎉</div>
          <h2 id="summary-title">Giỏi lắm!</h2>
          <div id="summary-stars" class="summary-stars"></div>
          <p id="summary-text" class="summary-text"></p>
          <div class="summary-btns">
            <button id="btn-replay" class="btn big">🔁 Chơi Lại</button>
            <button id="btn-menu" class="btn big">🏠 Về Menu</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div id="fx-layer"></div>

  <div id="letter-picker" class="popup">
    <div class="popup-backdrop" id="letter-picker-backdrop"></div>
    <div class="popup-card">
      <div class="popup-title">Chọn chữ cái</div>
      <div class="popup-grid" id="letter-grid"></div>
      <button class="btn" id="popup-close">Đóng</button>
    </div>
  </div>

  <div id="donate-popup" class="popup">
    <div class="popup-backdrop" id="donate-backdrop"></div>
    <div class="popup-card donate-card">
      <div class="donate-col-img">
        <img class="donate-img" src="assets/images/donate.jpg" alt="Mã QR số tài khoản ngân hàng">
      </div>
      <div class="donate-col-info">
        <div class="popup-title">💛 Ủng Hộ</div>
        <p class="donate-caption">Ủng hộ tác giả để duy trì phần mềm</p>
        <div class="donate-stk">
          <span class="donate-stk-label">Số tài khoản</span>
          <span class="donate-stk-num" id="donate-stk-num">19031570236699</span>
        </div>
        <div class="donate-actions">
          <button class="btn donate-act" id="donate-copy">📋 Copy STK</button>
          <a class="btn donate-act" id="donate-save" href="assets/images/donate.jpg" download="ma-qr-ung-ho.jpg">⬇️ Tải ảnh QR</a>
        </div>
        <button class="btn" id="donate-close">Đóng</button>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/games.js"></script>
  <script src="js/main.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
